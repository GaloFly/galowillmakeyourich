# El robot: cada empujón a main compila index.html (build.mjs) y publica dist/ en GitHub Pages.
# Quien edita index.html y empuja a main es Claude, desde el chat con Victor. Él solo abre la app
# en el iPhone y acepta la actualización.
#
# CÓMO SE PUBLICA: se empuja la carpeta dist/ a la rama `gh-pages`, y Pages sirve esa rama.
#   (Settings → Pages → Source: "Deploy from a branch" → gh-pages · / (root))
#
# ---------------------------------------------------------------------------------------------
# POR QUÉ ASÍ Y NO CON actions/deploy-pages (cambiado el 6-ago-2026)
#
# Aquella acción no empuja ficheros: crea un "despliegue" y espera a que la cola de Pages lo
# procese. Ese día la cola estuvo cerca de una hora parada y salieron tres problemas encadenados:
#
#   1. La acción se rinde a los 10 minutos. Es un TECHO DURO: subir el parámetro `timeout` se probó
#      y la propia acción lo rechaza ("timeout set to the maximum of 600000 milliseconds").
#   2. Al rendirse, CANCELA el despliegue. Y GitHub lo identifica por el commit, así que ese commit
#      quedaba inservible para siempre: cualquier reintento contestaba "Deployment cancelled" al
#      instante. Un solo fallo obligaba a un commit nuevo entero — un tropiezo se volvía tres.
#   3. Encima dependía del servicio de credenciales OIDC, que ese día devolvió 503 por saturación.
#
# Resultado: nueve intentos fallidos en una tarde para sacar ocho versiones, sin un solo fallo del
# código. Empujar dist/ a una rama es un `git push` normal: sin cola, sin tope de 10 minutos y sin
# quemar el commit — el mismo commit se puede reintentar las veces que haga falta.
#
# REQUISITO (ya hecho, pero anotado por si se recrea el repo): el token del robot necesita permiso
# de ESCRITURA. Estaba fijado a solo-lectura en la ORGANIZACIÓN (no en el repo, por eso la opción
# salía en gris) → github.com/organizations/GaloFly/settings/actions → Workflow permissions →
# "Read and write permissions". Sin eso el push devuelve 403 y la rama gh-pages no se crea.
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # write: hace falta para empujar la rama gh-pages

# cancel-in-progress: false — si llega otro empujón mientras hay una publicación a medias, que
# espere su turno en vez de cancelarla.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

      # Red de seguridad: si el compilado no está o vino vacío, parar aquí en vez de publicar una
      # web en blanco. Con la acción vieja esto lo cubría ella; empujando ficheros a pelo, nosotros.
      - name: Comprobar que el compilado está bien
        run: |
          test -s dist/index.html || { echo "::error::dist/index.html no existe o está vacío"; exit 1; }
          test -s dist/app.js     || { echo "::error::dist/app.js no existe o está vacío"; exit 1; }
          grep -q 'APP_VERSION' dist/index.html || { echo "::error::dist/index.html sin marcador de versión"; exit 1; }
          grep -q 'text/babel'   dist/index.html && { echo "::error::dist/index.html sin compilar (lleva text/babel)"; exit 1; }
          echo "Publicando $(grep -o 'APP_VERSION = "[0-9.]*"' dist/index.html | head -1)"

      - name: Publicar dist/ en la rama gh-pages
        run: |
          set -e
          cd dist
          # .nojekyll: sin él, Pages pasa el sitio por Jekyll, que se salta todo lo que empiece por "_"
          touch .nojekyll
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica ${GITHUB_SHA}"
          # force-push de un único commit: gh-pages es un espejo del compilado, no un historial.
          # El historial de verdad vive en main.
          if ! git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages; then
            echo "::error::No se pudo empujar gh-pages. Si el error es 403, el token está en solo-lectura: github.com/organizations/GaloFly/settings/actions → Workflow permissions → Read and write permissions."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------------------------
      # AVISAR A CLOUDFLARE (19-ago-2026)
      #
      # La app se publica en DOS sitios desde este mismo commit: la rama gh-pages (arriba) y
      # Cloudflare Pages, que sirve app.alphavext.com — la dirección que usa Victor.
      #
      # Cloudflare tiene su propia conexión con GitHub y debería enterarse solo. Esa noche dejó de
      # hacerlo: creaba despliegues de las OTRAS ramas (unos saltados, otros fallidos) pero para
      # `main` no creaba ninguno. Victor se quedó tres versiones atrás sin un solo aviso, mientras
      # la dirección vieja se actualizaba con normalidad — que es lo que hace este fallo tan
      # difícil de ver: no se rompe nada, simplemente deja de pasar algo.
      #
      # Con esto ya no dependemos de que se entere: cuando la publicación de arriba termina bien,
      # GitHub le dice explícitamente "despliega main". El hook es una dirección secreta que solo
      # sirve para DISPARAR un despliegue de esa rama; no lee nada ni da acceso a nada más, y vive
      # en los secretos del repositorio (nunca en el código ni en el chat).
      #
      # Va DESPUÉS de publicar y con `if: success()`: si el compilado falló, no se avisa a nadie.
      # Y si el secreto no está puesto, se dice y se sigue — quedarse sin la dirección vieja por no
      # tener configurada la nueva sería cambiar un problema por otro peor.
      - name: Avisar a Cloudflare para que despliegue main
        if: success()
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No hay CF_DEPLOY_HOOK configurado: app.alphavext.com no se actualizará hasta que Cloudflare se entere por su cuenta. Se crea en Cloudflare (Settings → Deploy Hooks, rama main) y se guarda como secreto del repositorio."
            exit 0
          fi
          codigo=$(curl -s -o /tmp/cf.txt -w '%{http_code}' -X POST "$HOOK")
          echo "Cloudflare respondió HTTP $codigo"
          [ -f /tmp/cf.txt ] && { head -c 300 /tmp/cf.txt; echo; }   # si curl ni salió, no hay fichero
          case "$codigo" in
            2*) echo "Despliegue de main pedido a Cloudflare." ;;
            # No se tumba la entrega por esto: en gh-pages YA está publicado y funcionando. Se avisa
            # fuerte para que se vea en la lista de ejecuciones, y se sigue.
            *)  echo "::warning::Cloudflare no aceptó el aviso (HTTP $codigo). La app está publicada en gh-pages; app.alphavext.com puede quedarse atrás." ;;
          esac
