# The robot: every push to main compiles index.html (build.mjs) and publishes dist/ to GitHub Pages.
# The editing routine does not change — upload index.html exactly as always; this does the rest.
#
# ONE-TIME SETUP (a human has to click this once):
#   repo Settings → Pages → "Build and deployment" → Source: "GitHub Actions"
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress: false a propósito (v4.35). Con `true`, si un despliegue de Pages se queda en
# cola —cosa que pasa cuando el servicio va con retraso— y llega otro empujón, se CANCELA el que
# estaba a medias. Y GitHub identifica cada despliegue por el commit: una vez marcado como cancelado,
# ese commit ya no se puede volver a publicar nunca (todo reintento contesta "Deployment cancelled")
# y hace falta un commit nuevo para desatascarlo. Pasó justo con la v4.35. Mejor dejar que el que
# está en vuelo termine y que el siguiente espere su turno.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Sin `timeout`: se probó subirlo a 20 min el 6-ago-2026 y la propia acción lo rechaza
      # ("timeout value is greater than the allowed maximum - timeout set to the maximum of
      # 600000 milliseconds"). 10 minutos es el techo duro de deploy-pages@v4; poner más solo
      # imprime un aviso y no cambia nada. Si Pages se atasca por encima de eso, no hay ajuste
      # que valga: hay que esperar a que el servicio se recupere y volver a empujar.
      - id: deployment
        uses: actions/deploy-pages@v4
