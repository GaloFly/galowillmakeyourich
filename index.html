(function () {
  function screenW() {
    /* screen.width en iOS no rota (siempre da el lado corto en vertical) */
    var land = Math.abs(window.orientation || 0) === 90;
    return land ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
  }
  function unzoom() {
    try {
      var m = document.querySelector('meta[name="viewport"]');
      if (!m) return;
      var sw = screenW();
      var lw = document.documentElement.clientWidth;
      if (sw > 0 && Math.abs(lw - sw) > 1) {
        /* viewport de layout corrupto → anclar al ancho físico exacto */
        m.setAttribute("content", "width=" + sw + ", initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover");
        setTimeout(function () { m.setAttribute("content", "width=" + sw + ", initial-scale=1, maximum-scale=1, viewport-fit=cover"); }, 80);
        return;
      }
      var vv = window.visualViewport;
      if (vv && Math.abs(vv.scale - 1) >= 0.01) {
        m.setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover");
        setTimeout(function () { m.setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"); }, 80);
      }
    } catch (e) {}
  }
  window.addEventListener("load", function () { setTimeout(unzoom, 300); });
  document.addEventListener("focusout", function () { setTimeout(unzoom, 350); });
  window.addEventListener("orientationchange", function () { setTimeout(unzoom, 400); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) setTimeout(unzoom, 300); });
  window.addEventListener("pageshow", function () { setTimeout(unzoom, 300); });
})();
</script>
<script>
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./sw.js").catch(function () {}); }
</script>
</body>
</html>
